name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      # Scans the whole history on every run, so a rewritten or force-pushed
      # branch is checked in full instead of as a commit range.
      - name: Scan repository history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .
