# Per-project control declaration for codeagent-ctl-server.
#
# Install as /etc/codeagent-mcp/ctl/<project-id>.conf, root:root 0640, where
# <project-id> matches the id in projects.yaml. The MCP never sends a path or a
# command — only a verb and, at most, a name that must already appear here.
#
# WARNING: this file is sourced by root. It is shell, not data. Its integrity
# is the security boundary for everything below.

# Units this project is allowed to control. A unit not listed here cannot be
# named by any caller: the helper answers ERR unit_not_declared.
UNITS=(example-web.service example-worker.service)

# The unit acted on when the caller names none.
PRIMARY=example-web.service

# Optional per-unit readiness gate. systemd reporting "active" is not the same
# as the app answering; a web tier measured ten seconds between the two.
# Dots and dashes in the unit name become underscores in the variable name.
HEALTH_example_web=http://127.0.0.1:8080/health

# Optional: run exec_run(run_as=...) and named actions as this account.
# Never root — the helper refuses it.
RUNAS_USER=example
RUNAS_ROOT=/opt/example

# Named actions. The caller sends only the name; the command lives here.
# Quote any value containing spaces, or bash will try to run the second word.
ACTION_health_deep="/opt/example/.venv/bin/example-health"
ACTION_migrate_check="/opt/example/.venv/bin/example migrate --check"

# Optional per-action environment file, read by systemd as root. The target
# account never needs read access to it, and the values are never returned.
ACTIONENV_health_deep="/etc/example/app.env"

# Ceiling for a named action. Note the plural: a setting prefixed ACTION_ would
# list itself as an action.
ACTIONS_TIMEOUT_S=300

# Optional: a unit that produces a consistent snapshot of live state.
SNAPSHOT_UNIT=example-snapshot.service
SNAPSHOT_FILE=/var/lib/example/snapshots/state.db.snapshot
